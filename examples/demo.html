<!doctype html>
<html><head><meta charset="utf-8"><title>seek-render demo</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:auto}</style></head>
<body>
<canvas id="c"></canvas>
<script>
// A seekable animation: everything on screen is a pure function of t (seconds).
// The renderer calls seek(t) for every frame and sub-frame, in any order.
const vert = new URLSearchParams(location.search).has('vert');
const W = vert ? 1080 : 1920, H = vert ? 1920 : 1080;
const c = document.getElementById('c'); c.width = W; c.height = H;
const g = c.getContext('2d');
window.DURATION = 6;

const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);

window.seek = t => {
  // background drifts slowly from night blue to warm red
  const k = t / DURATION;
  const bg = g.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, `hsl(${222 - 20 * k}, 45%, ${14 + 4 * k}%)`);
  bg.addColorStop(1, `hsl(${350}, 40%, ${10 + 6 * k}%)`);
  g.fillStyle = bg; g.fillRect(0, 0, W, H);

  // orbiting dots: fast motion shows the sub-frame motion blur
  for (let i = 0; i < 24; i++) {
    const a = t * (1.2 + i * 0.06) + i * 0.7, r = Math.min(W, H) * (0.18 + 0.012 * i);
    g.beginPath(); g.arc(W / 2 + Math.cos(a) * r, H / 2 + Math.sin(a) * r * 0.6, 10 + (i % 4) * 3, 0, Math.PI * 2);
    g.fillStyle = `hsla(${40 + i * 4}, 80%, 65%, .9)`; g.fill();
  }

  // a title that types itself in
  const txt = 'seek-render', n = Math.floor(ease((t - 0.5) / 2) * txt.length);
  g.fillStyle = '#fbf3dc'; g.font = `${Math.round(H * 0.09)}px Georgia, serif`; g.textAlign = 'center';
  g.fillText(txt.slice(0, n), W / 2, H / 2 + H * 0.03);
  g.globalAlpha = ease((t - 2.6) / 0.8);
  g.font = `${Math.round(H * 0.03)}px system-ui, sans-serif`;
  g.fillText('every frame is seek(t)', W / 2, H / 2 + H * 0.1);
  g.globalAlpha = 1;
};

seek(+(new URLSearchParams(location.search).get('t') || 0));
</script>
</body></html>
